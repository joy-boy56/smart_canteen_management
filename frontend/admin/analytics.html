<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics - Smart Canteen</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Smart Canteen</h1>
            <p>Queueing Theory Analytics</p>
        </header>
        <main>
            <div class="dashboard">
                <div class="dashboard-header">
                    <h2>Queueing Theory Analytics</h2>
                    <button id="logout-btn" class="btn btn-danger">Logout</button>
                    <button id="refresh-btn" class="btn btn-outline">Refresh Analysis</button>
                </div>
                <div class="dashboard-content">
                    <div class="widget">
                        <h3>Current System Status</h3>
                        <div id="current-status" class="analytics-content">
                            <div class="loading">Loading system status...</div>
                        </div>
                    </div>
                    <div class="widget">
                        <h3>Performance Metrics</h3>
                        <div id="performance-metrics" class="analytics-content">
                            <div class="loading">Loading performance metrics...</div>
                        </div>
                    </div>
                    <div class="widget">
                        <h3>Recommendations</h3>
                        <div id="recommendations" class="analytics-content">
                            <div class="loading">Generating recommendations...</div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="../js/auth.js"></script>
    <script src="../js/dashboard.js"></script>
    <script src="analytics.js"></script>
</body>
</html>
