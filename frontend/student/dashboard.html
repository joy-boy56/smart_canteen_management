<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard - Smart Canteen</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Smart Canteen</h1>
            <p>Student Dashboard</p>
        </header>
        <main>
            <div class="dashboard">
                <div class="dashboard-header">
                    <h2>Welcome, <span id="user-name">Student</span>!</h2>
                    <button id="logout-btn" class="btn btn-danger">Logout</button>
                </div>
                <div class="dashboard-content">
                    <div class="widget">
                        <h3>Menu</h3>
                        <p>View today's menu and place orders.</p>
                        <a href="menu.html" class="btn btn-primary">Go to Menu</a>
                    </div>
                    <div class="widget">
                        <h3>My Orders</h3>
                        <p>View your order history and current orders.</p>
                        <a href="orders.html" class="btn btn-primary">View Orders</a>
                    </div>
                    <div class="widget">
                        <h3>My Token</h3>
                        <p>View your current token and QR code.</p>
                        <a href="token.html" class="btn btn-primary">View Token</a>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="../js/auth.js"></script>
    <script src="../js/dashboard.js"></script>
</body>
</html>
