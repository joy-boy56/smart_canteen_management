<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart - Smart Canteen</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Smart Canteen</h1>
            <p>Your Cart</p>
        </header>
        <main>
            <div class="cart-header">
                <h2>Your Order</h2>
                <a href="menu.html" class="btn btn-secondary">Continue Shopping</a>
            </div>
            <div id="cart-items" class="cart-items">
                <!-- Cart items will be loaded here -->
                <div class="empty-cart">
                    <p>Your cart is empty</p>
                    <a href="menu.html" class="btn btn-primary">Browse Menu</a>
                </div>
            </div>
            <div id="cart-summary" class="cart-summary">
                <!-- Summary will be loaded here -->
            </div>
            <div class="checkout-section">
                <h3>Pickup Slot</h3>
                <div id="slot-selection" class="form-group">
                    <!-- Slot options will be loaded here -->
                    <div class="loading">Loading available slots...</div>
                </div>
                <h3>Payment Method</h3>
                <div class="form-group">
                    <div class="payment-option">
                        <input type="radio" id="payment-online" name="payment_method" value="online">
                        <label for="payment-online">Online (UPI)</label>
                    </div>
                    <div class="payment-option">
                        <input type="radio" id="payment-cash" name="payment_method" value="cash" checked>
                        <label for="payment-cash">Cash (Pay at Shop)</label>
                    </div>
                </div>
                <button id="checkout-btn" class="btn btn-primary">Place Order</button>
            </div>
        </main>
    </div>
    <script src="../js/auth.js"></script>
    <script src="../js/dashboard.js"></script>
    <script src="cart.js"></script>
</body>
</html>
